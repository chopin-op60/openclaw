name: PR 159702 worker inventory proof
on:
  push:
    branches: ["codex/proof-159702-20261016"]
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            target: 0dd9e0b7f7548ad751bd8e0dfdaed4d92e736ed7
          - mode: after
            target: 84b30acee664db7c30b2cbcefa406ff886dcd858
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin proof and source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr159702-proof" "$RUNNER_TEMP/pr159702-evidence"
          cp .github/proofs/pr159702/prove-worker-inventory.py "$RUNNER_TEMP/pr159702-proof/"
          cp .github/proofs/pr159702/regression.diff "$RUNNER_TEMP/pr159702-proof/"
          git fetch --depth=1 --no-tags origin "$TARGET"
          git checkout --detach "$TARGET"
          git rev-parse HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned pnpm and source dependencies without secrets
        run: |
          pnpm_version=$(python3 -c 'import json;print(json.load(open("package.json"))["packageManager"].split("@")[1].split("+")[0])')
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
      - name: Run focused worker regression with exact source binding
        env:
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,time
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr159702-evidence'
          before=os.environ['PROOF_MODE']=='baseline'
          if before:
              subprocess.run(['git','apply',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'pr159702-proof/regression.diff')],check=True)
          start=time.monotonic()
          args=['pnpm','test','src/skills/runtime/discovery.integration.test.ts','--maxWorkers=1']
          if before: args += ['-t','publishes diagnostic changes and removals after passive refresh with unchanged valid skills']
          r=subprocess.run(args,capture_output=True,text=True)
          text=r.stdout+r.stderr
          (out/'worker-regression.log').write_text(text)
          facts={'mode':os.environ['PROOF_MODE'],'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exitCode':r.returncode,'wallSeconds':round(time.monotonic()-start,2)}
          (out/'worker-regression.json').write_text(json.dumps(facts,indent=2)+'\n')
          print(json.dumps(facts));print(text)
          if before:
              assert r.returncode!=0 and 'description is required' in text and 'undefined' in text and 'AssertionError' in text, 'baseline must fail on missing diagnostics, not setup'
              subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','src/skills/runtime/discovery.integration.test.ts'],check=True)
          else:
              assert r.returncode==0,'current worker regression failed'
          PYCODE
      - name: Real worker Gateway to CLI proof
        env:
          PROOF_MODE: ${{ matrix.mode }}
        run: python3 "$RUNNER_TEMP/pr159702-proof/prove-worker-inventory.py" "$PROOF_MODE" --expect-sha "${{ matrix.target }}" --sandbox-parent "$RUNNER_TEMP"
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-inventory-${{ matrix.mode }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pr159702-evidence/
            ${{ runner.temp }}/openclaw-worker-inventory-*/evidence/
          retention-days: 14
