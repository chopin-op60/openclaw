name: PR 159702 status integration proof
on:
  push:
    branches: ["codex/proof-159702-20261020"]
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            target: e04673af077726403964526a3af9a97b6fbbef22
          - mode: after
            target: dab73b82fb28e4b530c01a2a8ae1fea31207b611
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin proof and source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr159702-proof" "$RUNNER_TEMP/pr159702-focused"
          cp .github/proofs/pr159702/prove-worker-inventory.py "$RUNNER_TEMP/pr159702-proof/"
          cp .github/proofs/pr159702/run-focused-proof.py "$RUNNER_TEMP/pr159702-proof/"
          cp .github/proofs/pr159702/regression.diff "$RUNNER_TEMP/pr159702-proof/"
          git fetch --depth=1 --no-tags origin "$TARGET"
          git checkout --detach "$TARGET"
          git rev-parse HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - id: install
        name: Install target-pinned pnpm and source dependencies without secrets
        run: |
          pnpm_version=$(python3 -c 'import json;print(json.load(open("package.json"))["packageManager"].split("@")[1].split("+")[0])')
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
      - name: Focused native-watch and consumer proof
        env:
          PROOF_MODE: ${{ matrix.mode }}
          TARGET: ${{ matrix.target }}
        run: python3 "$RUNNER_TEMP/pr159702-proof/run-focused-proof.py" "$PROOF_MODE" --expect-sha "$TARGET" --proof-dir "$RUNNER_TEMP/pr159702-proof" --evidence-dir "$RUNNER_TEMP/pr159702-focused"
      - name: Real Gateway and CLI native-watch proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PROOF_MODE: ${{ matrix.mode }}
          TARGET: ${{ matrix.target }}
        run: python3 "$RUNNER_TEMP/pr159702-proof/prove-worker-inventory.py" "$PROOF_MODE" --expect-sha "$TARGET" --sandbox-parent "$RUNNER_TEMP"
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-skill-inventory-${{ matrix.mode }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pr159702-focused/
            ${{ runner.temp }}/openclaw-worker-inventory-*/evidence/
          retention-days: 14
